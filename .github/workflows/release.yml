name: Release

on:
  push:
    tags:
      - "v*"
  # Lets an existing tag be rebuilt, so a packaging change can be published
  # without inventing a version for it.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach assets to (e.g. v1.5.3)"
        required: true

permissions:
  contents: write

env:
  RELEASE_ASSET_NAME: ai-usage-monitor.exe
  WINGET_PACKAGE_ID: hadufer.AIUsageMonitor
  # Copies at 1.6.0 or older cannot update themselves, so installs made under
  # the pre-rename id need one release through WinGet to reach one that can.
  # ponytail: stop updating it, then request its removal from winget-pkgs,
  # once those installs have had time to upgrade.
  LEGACY_RELEASE_ASSET_NAME: claude-code-usage-monitor.exe
  LEGACY_WINGET_PACKAGE_ID: hadufer.ClaudeCodeUsageMonitor

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = if ("${{ inputs.tag }}") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            winget install --id JRSoftware.InnoSetup --exact --silent `
              --accept-source-agreements --accept-package-agreements
            $iscc = (Get-ChildItem "${env:ProgramFiles(x86)}", "$env:LOCALAPPDATA\Programs" `
              -Filter ISCC.exe -Recurse -Depth 3 -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName)
          }
          if (-not $iscc) { throw "Inno Setup compiler not found" }
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.version }}" `
            "/Oinstaller/out" "installer/ai-usage-monitor.iss"
          if ($LASTEXITCODE -ne 0) { throw "installer build failed" }

      # The legacy WinGet id installs this copy, so its installs keep the file
      # name their "Start with Windows" value points at.
      # ponytail: drop it together with the legacy WinGet id.
      - name: Copy the exe under its legacy name
        shell: pwsh
        run: Copy-Item target/release/ai-usage-monitor.exe target/release/claude-code-usage-monitor.exe

      # The app refuses to install an update it cannot verify against this file,
      # so publishing it is what makes unattended updates possible at all.
      - name: Publish checksums
        shell: pwsh
        run: |
          $files = @(
            "target/release/ai-usage-monitor.exe",
            "target/release/claude-code-usage-monitor.exe",
            "installer/out/ai-usage-monitor-setup.exe"
          )
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            "$hash  $(Split-Path $f -Leaf)"
          }
          $lines | Set-Content -Path SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/ai-usage-monitor.exe
            target/release/claude-code-usage-monitor.exe
            installer/out/ai-usage-monitor-setup.exe
            SHA256SUMS.txt
          generate_release_notes: true

      # Only the installer, and no release-notes rewrite: the exe already on that
      # release is the one the published checksums refer to.
      - name: Attach installer to an existing release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: installer/out/ai-usage-monitor-setup.exe

  winget:
    needs: build
    runs-on: windows-latest
    env:
      WINGETCREATE_GITHUB_TOKEN: ${{ secrets.WINGETCREATE_GITHUB_TOKEN }}
    steps:
      - name: Prepare release metadata
        shell: pwsh
        run: |
          $tag = if ("${{ inputs.tag }}") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          $version = $tag.TrimStart('v')
          $releaseUrl = "https://github.com/${{ github.repository }}/releases/download/$tag"

          "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV
          "PACKAGE_URL=$releaseUrl/${{ env.RELEASE_ASSET_NAME }}" >> $env:GITHUB_ENV
          "LEGACY_PACKAGE_URL=$releaseUrl/${{ env.LEGACY_RELEASE_ASSET_NAME }}" >> $env:GITHUB_ENV

      - name: Skip when winget token is not configured
        if: env.WINGETCREATE_GITHUB_TOKEN == ''
        shell: pwsh
        run: |
          Write-Warning "Skipping WinGet submission because WINGETCREATE_GITHUB_TOKEN is not configured."

      - name: Install .NET 6 runtime
        if: env.WINGETCREATE_GITHUB_TOKEN != ''
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"

      - name: Download wingetcreate
        if: env.WINGETCREATE_GITHUB_TOKEN != ''
        shell: pwsh
        run: |
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe

      # Before the new package itself, which fails until its first submission
      # (made with `wingetcreate new`) has been merged.
      - name: Submit WinGet manifest update for the legacy id
        if: env.WINGETCREATE_GITHUB_TOKEN != ''
        shell: pwsh
        run: |
          .\wingetcreate.exe update `
            --submit `
            --token $env:WINGETCREATE_GITHUB_TOKEN `
            --urls $env:LEGACY_PACKAGE_URL `
            --version $env:PACKAGE_VERSION `
            $env:LEGACY_WINGET_PACKAGE_ID

      - name: Submit WinGet manifest update
        if: env.WINGETCREATE_GITHUB_TOKEN != ''
        shell: pwsh
        run: |
          .\wingetcreate.exe update `
            --submit `
            --token $env:WINGETCREATE_GITHUB_TOKEN `
            --urls $env:PACKAGE_URL `
            --version $env:PACKAGE_VERSION `
            $env:WINGET_PACKAGE_ID
